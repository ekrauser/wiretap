[mod-setting-name]
wiretap-interval-seconds=Export interval (seconds)
wiretap-mode=Output mode
wiretap-filename=Snapshot filename
wiretap-journal-filename=Journal filename
wiretap-server-only=Write on server only
wiretap-logistics=Export logistic network contents
wiretap-quality-breakdown=Break down items by quality
wiretap-power=Export power statistics
wiretap-power-breakdown=Break down power by entity type
wiretap-accumulators=Scan accumulators (charge/capacity)
wiretap-production=Export production totals
wiretap-science=Export science pack rates
wiretap-pollution=Export pollution

[mod-setting-description]
wiretap-interval-seconds=How often a stats snapshot is exported to script-output.
wiretap-mode=snapshot: overwrite one JSON file each interval. journal: append one JSON line per interval (NDJSON, grows forever). both: do both.
wiretap-filename=Path of the snapshot file, relative to the script-output folder.
wiretap-journal-filename=Path of the append-only NDJSON journal, relative to the script-output folder.
wiretap-server-only=If enabled, the file is only written on the server (or in single player, your machine). Disable if no file appears in your setup.
wiretap-logistics=Include item counts and robot counts for every logistic network, per surface and force.
wiretap-quality-breakdown=Additionally list logistic items keyed as "name:quality". Off by default to keep the file small.
wiretap-power=Include per-electric-network production and consumption in watts for every surface.
wiretap-power-breakdown=Include per-entity-type watts (e.g. how much your steam engines produce and your assemblers consume).
wiretap-accumulators=Scan accumulator entities each export to report stored joules and capacity. Requires power export to be enabled. Disable on gigantic bases if you notice stutter.
wiretap-production=Include all-time item/fluid production and consumption totals per force and surface.
wiretap-science=Include per-science-pack production/consumption rates (packs per minute, 1 and 10 minute averages) and totals, plus current research progress.
wiretap-pollution=Include total pollution and cumulative pollution sources/sinks per surface.
