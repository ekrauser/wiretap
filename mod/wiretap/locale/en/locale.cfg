[mod-setting-name]
wiretap-interval-seconds=Export interval (seconds)
wiretap-decimals=Number precision (decimal places)
wiretap-spread=Spread the export over several ticks
wiretap-mode=Output mode
wiretap-filename=Snapshot filename
wiretap-journal-filename=Journal filename
wiretap-server-only=Write on server only
wiretap-logistics=Export logistic network contents
wiretap-quality-breakdown=Break down items by quality
wiretap-power=Export power statistics
wiretap-power-breakdown=Break down power by entity type
wiretap-power-flow=Export power flow and satisfaction
wiretap-production=Export production totals
wiretap-production-quality=Break down production totals by quality
wiretap-science=Export science pack rates
wiretap-pollution=Export pollution
wiretap-platforms=Export space platforms
wiretap-kills=Export kills and losses
wiretap-build-counts=Export entity build counts

[mod-setting-description]
wiretap-interval-seconds=How often a stats snapshot is exported to script-output.
wiretap-decimals=Round exported numbers to this many decimal places. Keeps the JSON small; raise it if you need more precision. Fractions between -1 and 1 (progress, evolution, satisfaction) always keep at least three decimals.
wiretap-spread=Collect one surface or one force per game tick and write the file when the last one is done, instead of doing everything in a single tick. Keeps the per-tick cost low on large bases; the snapshot then spans a few consecutive ticks (meta.export_ticks says how many). The /wiretap command and the remote interface always build the snapshot in one go.
wiretap-mode=snapshot: overwrite one JSON file each interval. journal: append one JSON line per interval (NDJSON, grows forever). both: do both.
wiretap-filename=Path of the snapshot file, relative to the script-output folder.
wiretap-journal-filename=Path of the append-only NDJSON journal, relative to the script-output folder.
wiretap-server-only=Multiplayer only: if enabled, the file is written only on the server, not on every connected player's machine. Ignored in single player, where the file is always written.
wiretap-logistics=Include item counts and robot counts for every logistic network, per surface and force.
wiretap-quality-breakdown=Additionally list logistic items keyed as "name:quality". Off by default to keep the file small.
wiretap-power=Include per-electric-network production and consumption in watts plus accumulator charge and capacity for every surface.
wiretap-power-breakdown=Include per-entity-type watts (e.g. how much your steam engines produce and your assemblers consume) and a count of each such entity type on the surface. The counts cost one surface scan per entity type; turn this off on very large bases if exports stutter.
wiretap-power-flow=Include last-tick flow per network: consumption satisfaction (1 = no brownout) as sampled on the export tick and as the minimum seen since the previous export, production satisfaction, maximum production and consumption, solar, accumulator charge and discharge, and transferred watts.
wiretap-production=Include all-time item/fluid production and consumption totals per force and surface.
wiretap-production-quality=Additionally list item production and consumption totals per quality level (only "normal" appears when the quality mod is disabled). Off by default to keep the file small.
wiretap-science=Include per-science-pack production/consumption rates (packs per minute, 1 and 10 minute averages) and totals, plus the effective research rate. Research progress is always exported regardless of this setting.
wiretap-pollution=Include total pollution and cumulative pollution sources/sinks per surface.
wiretap-platforms=Include every space platform per force: state, speed, location, destination, weight, completed trips, damaged tiles.
wiretap-kills=Include enemies killed and entities lost per force and surface, all time and per minute.
wiretap-build-counts=Include all-time counts of entities built and mined per force and surface. Off by default; the tables are as large as the production totals.
